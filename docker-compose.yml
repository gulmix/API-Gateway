services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - backend-1
      - backend-2
  
  backend-1:
    build: .
    command: ["./mockbackend"]
    environment:
      PORT: "8081"
      NAME: "backend-1"
    ports:
      - "8081:8081"

  backend-2:
    build: .
    command: ["./mockbackend"]
    environment:
      PORT: "8082"
      NAME: "backend-2"
    ports:
      - "8082:8082"

  redis:
    image: redis:4-alpine
    ports:
      - "6379:6379"